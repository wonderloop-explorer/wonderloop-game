<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"> <!-- 정식 공개 전까지 검색 엔진에 안 나오게(한 파일 HTML도 이 줄을 그대로 가져간다) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>원더룹 베이스캠프 — 화풍 실험</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"> <!-- 그리기를 막지 않게(로딩 화면이 바로 뜨도록) -->
<style>
:root{
  --bg:#efe2c9; --bg2:#e6d3b2; --ink:#4b3a2b; --soft:#7a6450;
  --chip:#fbf3e2; --chipline:#c8ab83; --teal:#2f9e92;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2a2420; --bg2:#201b18; --ink:#f2e5cf; --soft:#c5b096;
    --chip:#3a3029; --chipline:#6f5b46; --teal:#5cc7ba; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a2420; --bg2:#201b18; --ink:#f2e5cf; --soft:#c5b096;
  --chip:#3a3029; --chipline:#6f5b46; --teal:#5cc7ba; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* 아이폰 사파리 페이지 확대 막기(2026-11-02): 모든 요소에서 두 손가락·두 번 누르기 확대를 끈다 — 카메라 확대·축소는 게임이 직접(controls). 길게 눌러 고르기·확대경도 끔 */
html,body,body *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#wlHelp .hcard{touch-action:pan-y}
body{
  background:radial-gradient(120% 90% at 50% 40%, var(--bg) 0%, var(--bg2) 100%);
  color:var(--ink);
  font-family:'Gaegu','Nanum Pen Script','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  overflow:hidden;
}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.grain{
  position:fixed;inset:0;pointer-events:none;opacity:.2;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .27 0 0 0 0 .18 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
header{
  position:fixed;top:0;left:0;right:0;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0 calc(60px + env(safe-area-inset-left,0px));
  pointer-events:none;
}
h1{margin:0;font-size:clamp(26px,4vw,38px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
header p{margin:4px 0 0;font-size:18px;color:var(--soft)}
.bar{
  position:fixed;left:0;right:0;bottom:0;
  padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
}
button{
  font:inherit;font-size:20px;font-weight:700;color:var(--ink);
  background:var(--chip);border:2px solid var(--chipline);
  border-radius:16px 13px 17px 12px;padding:6px 16px 7px;cursor:pointer;
  box-shadow:2px 3px 0 var(--chipline);
}
button:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--chipline)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.hint{width:100%;text-align:center;font-size:17px;color:var(--soft)}
@media (max-width:520px){ button{font-size:18px} .hint{font-size:15px} }
@media (pointer:coarse){ .grain{display:none} } /* 개미굴과 같음: 휴대폰은 종이결 덮개(화면 전체 섞기)를 빼서 매 프레임 합성 비용을 던다 */
/* 시험용 단추(시간·둘러보기·탈·머리…)와 성능 표시는 평소에 숨기고, 왼쪽 위 톱니 단추나 주소 뒤 ?debug 로 연다(08). 안내 글자는 컴퓨터에서만(휴대폰은 조이스틱·단추와 겹쳐서 숨김) */
.bar>button,#stats{display:none}
body.debug .bar>button{display:inline-block} body.debug #stats{display:block;order:-1;width:auto;max-width:100%;white-space:pre-line;text-align:left;background:rgba(40,26,34,.84);color:#fff6e8;border-radius:12px;padding:6px 12px;font:600 13px/1.5 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif} /* 성능 표시: 읽기 쉬운 상자, 시험용 단추 맨 위 */
#dbgBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:15;
  width:52px;height:52px;padding:0;display:grid;place-items:center;border-radius:50%;box-sizing:border-box;color:#4a2a2a;
  background:rgba(255,246,230,.42);border:4px solid rgba(90,56,38,.75);box-shadow:0 4px 0 rgba(90,56,38,.55)} /* 반투명 펠트(game/felt wl-glass와 같은 값 — 이 단추는 게임 UI 바깥이라 값을 그대로 적음) */
#dbgBtn::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(255,246,230,.7);border-radius:50%;pointer-events:none}
#dbgBtn svg{width:24px;height:24px;display:block}
body.debug #wlQuest{visibility:hidden} /* 시험용 단추를 연 동안 위 안내 문구는 숨김(성능 표시와 겹치지 않게) */
body.debug #dbgBtn{background:rgba(255,184,107,.72)}
body:not(.wl-dev) #dbgBtn{display:none} /* 톱니 단추: 공개 주소 게임은 절대 없음, 한 파일 HTML(개발자판)은 늘, 로컬은 ?debug 일 때만(08) */
body.wl-world .bar .hint:not(#stats){display:none} /* 세계 구역에서는 아래 조작 안내 글자를 빼고 조작법 창으로(08 zoneLook) */
@media (pointer:coarse){
  .bar .hint{display:none}
  body.debug #stats{display:block}
  body.debug .bar{top:calc(56px + env(safe-area-inset-top,0px));bottom:auto;align-content:flex-start;max-height:62vh;overflow-y:auto}
}
</style>
<!-- 공통 로딩 화면 #wlBoot (시리즈 공통 틀, 2026-11-04 — 모든 세계가 같은 화면·같은 문구). 글꼴은 그리기를 막지 않게 늦게 붙이고(그동안 기본 글꼴로 글자가 먼저 보임),
     ui.js는 data-wl-font가 있으면 다시 붙이지 않는다. 행성 그림은 바로 받기 시작한다(한 파일 HTML은 WL_BOOT_IMG data URI). -->
<link rel="stylesheet" data-wl-font="1" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" media="print" onload="this.media='all'">
<link rel="preload" as="image" href="assets/common/loading-planet.webp" data-wl-boot>
<style>
#wlBoot{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#F7F0E3;color:#6B5446;
  box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:opacity .4s ease;
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
#wlBoot::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#wlBoot .wbw{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;margin-top:-6vh}
#wlBoot canvas{width:min(78vw,360px);aspect-ratio:1/1;height:auto;display:block}
#wlBoot h1{font-family:"Jua","Apple SD Gothic Neo",sans-serif;font-weight:400;font-size:clamp(24px,6.4vw,34px);letter-spacing:-.01em;line-height:1.25;margin:6px 0 10px;word-break:keep-all;color:#6B5446;text-shadow:none}
#wlBoot p{font-size:clamp(15px,4vw,19px);color:#A08A7A;margin:0;word-break:keep-all;line-height:normal}
#wlBoot.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<!-- 공통 로딩 화면 (시안 wonderloop-loading.html 그대로 — 2D canvas만, three·세계 파일을 기다리지 않음).
     08이 첫 구역을 그린 뒤 wlBootDone()을 부르면: 연 지 1초가 안 됐으면 1초까지 기다렸다 0.4초에 걸쳐 사라지고, 루프를 멈추고 요소를 지운다.
     그리기는 워커(OffscreenCanvas 2D — 게임 준비로 주 스레드가 바빠도 돎, 안 되면 주 스레드), 30프레임, 화면이 안 보이면 멈춤, 픽셀 비율 최대 2, 움직임 줄이기면 0.25배 빠르기. 촬영 모드(?shot)는 바로 지움. 상태는 window.wlBootStat -->
<div id="wlBoot" role="status" aria-live="polite"><div class="wbw">
  <canvas id="wlBootCv" aria-label="원더룹 행성"></canvas>
  <h1>원더룹의 탐험지로 이동 중...</h1>
  <p>처음에는 몇 초 걸릴 수 있어요</p>
</div></div>
<script>
(function(){
  var el = document.getElementById('wlBoot'), st = window.wlBootStat = {shown: performance.now(), mode: '', frames: 0, first: 0, planet: 0, done: 0, removed: 0, running: true};
  window.wlBootDone = function(){};
  if(!el) return;
  if(/[?&]shot(=|&|$)/.test(location.search)){ el.remove(); st.running = false; return; }

  // ── 그리기 (시안 그대로). 2048 x 2048 기준 좌표. 행성은 포토샵에서 다듬은 그림 한 장(assets/common/loading-planet.webp, 1024 투명).
  //    워커에서도 같은 코드를 쓰려고 함수 하나로 감쌌다(toString으로 워커에 넘김 — 바깥 변수를 쓰지 않는다).
  function painter(ctx){
    var U = 2048;
    var ORBIT = {cx:1064, cy:1192, a:817, b:494, rot:-25.8*Math.PI/180};   // 발자국 고리 (행성 뒤로 도는 부분은 행성 그림 아래에 그려서 가려짐)
    var STEPS = 16, SPEED = 0.42, FOOT = 600;
    var PINK = '#E58E98', GOLD = '#F2B935';
    function solePath(c){
      // 발끝이 위(-y)를 향하는 신발 바닥 + 뒤꿈치
      c.beginPath();
      c.moveTo(0,0.02);
      c.bezierCurveTo(0.05,0.02, 0.062,-0.04, 0.062,-0.085);
      c.bezierCurveTo(0.062,-0.135, 0.035,-0.165, 0.002,-0.165);
      c.bezierCurveTo(-0.04,-0.165,-0.062,-0.125,-0.056,-0.075);
      c.bezierCurveTo(-0.05,-0.03,-0.042,0.02, 0,0.02);
      c.closePath();
      c.moveTo(0.045,0.075);
      c.ellipse(0.003,0.075,0.042,0.046,0,0,Math.PI*2);
    }
    var cr = Math.cos(ORBIT.rot), sr = Math.sin(ORBIT.rot);
    function orbitPoint(th){
      var lx = ORBIT.a*Math.cos(th), ly = ORBIT.b*Math.sin(th);
      return [ORBIT.cx + lx*cr - ly*sr, ORBIT.cy + lx*sr + ly*cr];
    }
    function drawSteps(t, front){
      for(var i=0;i<STEPS;i++){
        var th = i/STEPS*Math.PI*2 + t*SPEED;
        var s = Math.sin(th);
        if((s>0) !== front) continue;
        var p = orbitPoint(th), p2 = orbitPoint(th+0.01), x = p[0], y = p[1];
        var ang = Math.atan2(p2[1]-y, p2[0]-x) + Math.PI/2;
        var depth = 0.86 + 0.2*(s+1)/2;          // 앞쪽은 조금 크게, 뒤쪽은 작게
        var left = i%2===0;                       // 왼발·오른발 번갈아
        ctx.save();
        ctx.translate(x,y); ctx.rotate(ang);
        ctx.translate(left?-8:8, 0);
        ctx.scale((left?-1:1)*FOOT*depth, FOOT*depth);
        solePath(ctx);
        ctx.fillStyle = PINK; ctx.fill();
        ctx.restore();
      }
    }
    var STARS = [[100,500,95,0],[1935,1505,58,1.7],[1745,380,30,3.1]];
    function drawStar(x,y,r,rot,alpha){
      ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha = alpha;
      ctx.beginPath();
      for(var i=0;i<8;i++){
        var rr = i%2 ? r*0.28 : r, a = i/8*Math.PI*2 - Math.PI/2;
        i ? ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr) : ctx.moveTo(Math.cos(a)*rr, Math.sin(a)*rr);
      }
      ctx.closePath(); ctx.fillStyle = GOLD; ctx.fill(); ctx.restore();
    }
    return function draw(t, planet){
      var cv = ctx.canvas, k = cv.width/U;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.setTransform(k,0,0,k,0,0);
      drawSteps(t, false);                                     // 행성 뒤
      if(planet) ctx.drawImage(planet, 0, Math.sin(t*1.2)*11, U, U);   // 위아래로 살짝 둥실
      drawSteps(t, true);                                      // 행성 앞
      STARS.forEach(function(q){                               // 노란 반짝이 셋이 번갈아
        var s = 0.55+0.45*Math.sin(t*4.8+q[3]);
        drawStar(q[0], q[1], q[2]*(0.7+0.4*s), Math.sin(t*2+q[3])*0.15, 0.45+0.55*s);
      });
    };
  }

  // ── 워커 쪽: 게임이 첫 구역을 만드는 동안 주 스레드가 몇 초씩 바빠도 고리가 30프레임으로 돈다(주 스레드에서 그리면 멈춘 듯 보였다).
  function workerMain(painter){
    var draw, cv, planet = null, hidden = false, speed = 1, t = 0, last = 0, n = 0, timer = 0;
    function tick(){
      timer = setTimeout(tick, 1000/30);                       // 30프레임
      if(hidden){ last = 0; return; }                          // 화면이 안 보이면 멈춤
      var now = performance.now(), dt = last ? Math.min((now-last)/1000, 0.1) : 0; last = now; t += dt*speed;
      draw(t, planet); postMessage({f: ++n});
    }
    onmessage = function(e){
      var d = e.data;
      if(d.canvas){
        cv = d.canvas; speed = d.speed; cv.width = cv.height = d.size; draw = painter(cv.getContext('2d'));
        fetch(d.src).then(function(r){ return r.blob(); }).then(createImageBitmap)
          .then(function(b){ planet = b; postMessage({planet: 1}); })
          .catch(function(){ postMessage({needImg: 1}); });     // 워커에서 못 받으면 주 스레드가 그림을 넘겨줌
        tick();
      }
      if(d.img) planet = d.img;
      if(d.size){ cv.width = cv.height = d.size; draw(t, planet); }
      if('hidden' in d) hidden = d.hidden;
    };
  }

  var canvas = document.getElementById('wlBootCv');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var speed = reduce ? 0.25 : 1;                               // 움직임 줄이기: 천천히
  var src = window.WL_BOOT_IMG || 'assets/common/loading-planet.webp';
  function px(){ return Math.max(1, Math.round((canvas.clientWidth || Math.min(innerWidth*0.78, 360)) * Math.min(window.devicePixelRatio||1, 2))); } // 픽셀 비율 최대 2
  var planet = new Image(), worker = null, raf = 0, onRes, onVis;
  function sendImg(){                                         // 워커가 그림을 못 받았을 때
    planet.onload = function(){ st.planet = performance.now();
      if(window.createImageBitmap) createImageBitmap(planet).then(function(b){ worker && worker.postMessage({img: b}, [b]); }); };
    planet.src = src;
  }

  function mainLoop(cv){                                       // 워커를 못 쓰는 브라우저: 시안처럼 주 스레드에서
    st.mode = 'main';
    var draw = painter(cv.getContext('2d')), last = 0, t = 0;
    if(!planet.src){ planet.onload = function(){ st.planet = performance.now(); }; planet.src = src; }
    onRes = function(){ cv.width = cv.height = px(); }; onRes();
    function frame(){ draw(t, planet.complete && planet.naturalWidth ? planet : null); st.frames++; if(!st.first) st.first = performance.now(); }
    function loop(now){
      if(!st.running) return;
      raf = requestAnimationFrame(loop);
      if(document.hidden) return;
      if(now-last < 1000/30 - 1) return;
      var dt = last ? Math.min((now-last)/1000, 0.1) : 0; last = now; t += dt*speed;
      frame();
    }
    frame(); raf = requestAnimationFrame(loop);
  }

  function fallback(){                                         // 캔버스를 이미 워커에 넘겼으면 새 캔버스로 바꿔 끼운다
    if(worker){ worker.terminate(); worker = null; }
    var fresh = document.createElement('canvas'); fresh.id = 'wlBootCv'; fresh.setAttribute('aria-label', '원더룹 행성');
    canvas.replaceWith(fresh); canvas = fresh; mainLoop(fresh);
  }

  try{
    if(!canvas.transferControlToOffscreen || !window.Worker || !window.createImageBitmap) throw 0;
    var url = URL.createObjectURL(new Blob(['(' + workerMain + ')(' + painter + ');'], {type: 'text/javascript'}));
    worker = new Worker(url);
    st.mode = 'worker';
    worker.onmessage = function(e){
      var d = e.data;
      if(d.f){ st.frames = d.f; if(!st.first) st.first = performance.now(); }
      if(d.planet) st.planet = performance.now();
      if(d.needImg) sendImg();
    };
    worker.onerror = function(e){ e.preventDefault && e.preventDefault(); if(st.running && st.mode === 'worker') fallback(); };
    var off = canvas.transferControlToOffscreen();
    worker.postMessage({canvas: off, size: px(), speed: speed, src: new URL(src, location.href).href}, [off]);
    onRes = function(){ worker && worker.postMessage({size: px()}); };
    onVis = function(){ worker && worker.postMessage({hidden: document.hidden}); };
    document.addEventListener('visibilitychange', onVis);
  }catch(e){ if(worker){ fallback(); } else mainLoop(canvas); }
  window.addEventListener('resize', function(){ onRes && onRes(); });

  window.wlBootDone = function(){
    if(st.done) return; st.done = performance.now();
    setTimeout(function(){                                     // 너무 빨리 끝나 깜빡이지 않게 최소 1초
      el.classList.add('gone');                                // 0.4초에 걸쳐 사라짐
      setTimeout(function(){                                   // 사라진 뒤: 루프·워커를 멈추고 요소를 지운다(휴대폰 발열)
        st.running = false; cancelAnimationFrame(raf);
        if(worker){ worker.terminate(); worker = null; }
        if(onVis) document.removeEventListener('visibilitychange', onVis);
        onRes = null; planet.onload = null; el.remove(); st.removed = performance.now();
      }, 420);
    }, Math.max(0, 1000 - (st.done - st.shown)));
  };
})();
</script>
<div id="stage"></div>
<div class="grain"></div>
<header>
  <h1>원더룹 베이스캠프</h1>
