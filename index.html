<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"> <!-- 정식 공개 전까지 검색 엔진에 안 나오게(한 파일 HTML도 이 줄을 그대로 가져간다) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>원더룹 베이스캠프 — 화풍 실험</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe2c9; --bg2:#e6d3b2; --ink:#4b3a2b; --soft:#7a6450;
  --chip:#fbf3e2; --chipline:#c8ab83; --teal:#2f9e92;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2a2420; --bg2:#201b18; --ink:#f2e5cf; --soft:#c5b096;
    --chip:#3a3029; --chipline:#6f5b46; --teal:#5cc7ba; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2a2420; --bg2:#201b18; --ink:#f2e5cf; --soft:#c5b096;
  --chip:#3a3029; --chipline:#6f5b46; --teal:#5cc7ba; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* 아이폰 사파리 페이지 확대 막기(2026-11-02): 모든 요소에서 두 손가락·두 번 누르기 확대를 끈다 — 카메라 확대·축소는 게임이 직접(controls). 길게 눌러 고르기·확대경도 끔 */
html,body,body *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#wlHelp .hcard{touch-action:pan-y}
body{
  background:radial-gradient(120% 90% at 50% 40%, var(--bg) 0%, var(--bg2) 100%);
  color:var(--ink);
  font-family:'Gaegu','Nanum Pen Script','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  overflow:hidden;
}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.grain{
  position:fixed;inset:0;pointer-events:none;opacity:.2;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .27 0 0 0 0 .18 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
header{
  position:fixed;top:0;left:0;right:0;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0 calc(60px + env(safe-area-inset-left,0px));
  pointer-events:none;
}
h1{margin:0;font-size:clamp(26px,4vw,38px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
header p{margin:4px 0 0;font-size:18px;color:var(--soft)}
.bar{
  position:fixed;left:0;right:0;bottom:0;
  padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
}
button{
  font:inherit;font-size:20px;font-weight:700;color:var(--ink);
  background:var(--chip);border:2px solid var(--chipline);
  border-radius:16px 13px 17px 12px;padding:6px 16px 7px;cursor:pointer;
  box-shadow:2px 3px 0 var(--chipline);
}
button:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--chipline)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.hint{width:100%;text-align:center;font-size:17px;color:var(--soft)}
@media (max-width:520px){ button{font-size:18px} .hint{font-size:15px} }
@media (pointer:coarse){ .grain{display:none} } /* 개미굴과 같음: 휴대폰은 종이결 덮개(화면 전체 섞기)를 빼서 매 프레임 합성 비용을 던다 */
/* 시험용 단추(시간·둘러보기·탈·머리…)와 성능 표시는 평소에 숨기고, 왼쪽 위 톱니 단추나 주소 뒤 ?debug 로 연다(08). 안내 글자는 컴퓨터에서만(휴대폰은 조이스틱·단추와 겹쳐서 숨김) */
.bar>button,#stats{display:none}
body.debug .bar>button{display:inline-block} body.debug #stats{display:block;order:-1;width:auto;max-width:100%;white-space:pre-line;text-align:left;background:rgba(40,26,34,.84);color:#fff6e8;border-radius:12px;padding:6px 12px;font:600 13px/1.5 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif} /* 성능 표시: 읽기 쉬운 상자, 시험용 단추 맨 위 */
#dbgBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:15;
  width:52px;height:52px;padding:0;display:grid;place-items:center;border-radius:50%;box-sizing:border-box;color:#4a2a2a;
  background:rgba(255,246,230,.42);border:4px solid rgba(90,56,38,.75);box-shadow:0 4px 0 rgba(90,56,38,.55)} /* 반투명 펠트(game/felt wl-glass와 같은 값 — 이 단추는 게임 UI 바깥이라 값을 그대로 적음) */
#dbgBtn::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(255,246,230,.7);border-radius:50%;pointer-events:none}
#dbgBtn svg{width:24px;height:24px;display:block}
body.debug #wlQuest{visibility:hidden} /* 시험용 단추를 연 동안 위 안내 문구는 숨김(성능 표시와 겹치지 않게) */
body.debug #dbgBtn{background:rgba(255,184,107,.72)}
body:not(.wl-dev) #dbgBtn{display:none} /* 톱니 단추는 주소 뒤 ?debug 일 때만(08) */
body.wl-world .bar .hint:not(#stats){display:none} /* 세계 구역에서는 아래 조작 안내 글자를 빼고 조작법 창으로(08 zoneLook) */
@media (pointer:coarse){
  .bar .hint{display:none}
  body.debug #stats{display:block}
  body.debug .bar{top:calc(56px + env(safe-area-inset-top,0px));bottom:auto;align-content:flex-start;max-height:62vh;overflow-y:auto}
}
</style>

<body>
<div id="stage"></div>
<div class="grain"></div>
<header>
  <h1>원더룹 베이스캠프</h1>
  <p>파스텔 색연필 로우폴리, 소품·텍스처 디테일 실험</p>
</header>
<button id="dbgBtn" type="button" aria-label="시험용 단추 열기" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.7c.1.6.1 1.2 0 1.8l2 1.7-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-2.9 2-1.7a5.6 5.6 0 0 1 0-1.8l-2-1.7 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z"/></svg></button>
<div class="bar">
  <button id="dayBtn" type="button">저녁으로 바꾸기</button>
  <button id="spinBtn" type="button">천천히 둘러보기</button>
  <button id="camBtn" type="button">카메라: 따라가기</button>
  <button id="optBtn" type="button">최적화 끄기</button>
  <button id="hoodBtn" type="button">탈: 없음</button>
  <button id="hairBtn" type="button">머리: 지그재그 단발</button>
  <button id="exprBtn" type="button">표정: 기본</button>
  <button id="actBtn" type="button">동작: 서기</button>
  <button id="emphBtn" type="button">캐릭터 강조: 자동</button>
  <button id="outfitBtn" type="button">옷: 평상복</button>
  <button id="bendBtn" type="button">둥근 땅: 중</button>
  <button id="resetBtn" type="button">진행 초기화</button>
  <div class="hint" id="stats" aria-live="polite"></div>
  <div class="hint">끌어서 돌려 보고, 휠이나 두 손가락으로 확대해요. 바닥을 누르면 원더룹이 걸어가고, 원더룹을 누르면 인사해요. 버섯 랜턴은 눌러서 켜고 꺼요.</div>
</div>

<script id="wl-vercheck">fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.v&&j.v!==window.WL_V){const u=new URL(location.href);if(u.searchParams.get('_v')!==j.v){u.searchParams.set('_v',j.v);location.replace(u);}}}).catch(()=>{});</script>
